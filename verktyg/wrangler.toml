# Mellanservern (Cloudflare Worker) - laddas upp av Cloudflare Workers Builds (Path = verktyg), kopplat 18/11
name = "modelltittaren"
main = "mellanserver.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Delad cache (Workers Caching). Ingången "default" kollar och lägger på CORS (ingen cache),
# "Kalla" hämtar från met.no/aviationweather och cachas.
[cache]
enabled = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.Kalla]
type = "worker"

  [exports.Kalla.cache]
  enabled = true

# Statistik (19/11): D1-databas med antal anrop och hämtningar från met.no per dag
[[d1_databases]]
binding = "DB"
database_name = "modelltittaren-statistik"
database_id = "7c2edb18-a928-492c-80fb-489aa41156b6"

# SMHI-radarn samlas var 5:e minut (21/11 natt) - se smhiSamla i mellanserver.js
[triggers]
crons = ["*/5 * * * *"]
