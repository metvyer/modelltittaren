# Modelltittaren - publicera sidan (GitHub Pages via Actions)
#
# Kors nar koden i main andras, nar en forhamtning ar klar och for hand.
# Bygger sidan av main + det senaste forhamtade datat (grenen "data", mappen
# forhamtat/) och publicerar. Tar ungefar en minut.
name: Publicera

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Förhämtning", "Uppdatera flygplatser"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publicera
  cancel-in-progress: true

jobs:
  publicera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Hämta förhämtat data (grenen data)
        run: |
          mkdir -p forhamtat
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git --work-tree=forhamtat checkout origin/data -- .
            git reset -q
          fi
          cat forhamtat/th/index.json 2>/dev/null | head -3 || true

      - name: Bygg sidan
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHubs publiceringstjanst ger ibland tillfalliga fel ("Fetching artifact metadata failed").
      # Forsta forsoket far misslyckas tyst; da vantar vi en minut och forsoker en gang till.
      # Felmejl kommer bara om aven andra forsoket misslyckas.
      - name: Publicera (forsok 1)
        id: forsok1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Vanta en minut
        if: steps.forsok1.outcome == 'failure'
        run: sleep 60

      - name: Publicera (forsok 2)
        if: steps.forsok1.outcome == 'failure'
        uses: actions/deploy-pages@v4
