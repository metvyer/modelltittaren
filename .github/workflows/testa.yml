# Modelltittaren - testkorning mot riktiga data (NYTT 19/11)
#
# Startas bara FOR HAND: Actions -> "Testa thredds" -> Run workflow (valj
# flygplats). Kor verktyg/testa_thredds.py: senaste ensemblekorning, medlems-
# attributen (.das), meteogramfragan, ett sannolikhetsomrade (binart) och
# mellanservern jamfort med direkt. Resultatet visas i korningens Summary och
# som fil under Artifacts. Andrar ingenting i repot och publicerar inget.
name: Testa thredds

on:
  workflow_dispatch:
    inputs:
      punkt:
        description: "Flygplats (ICAO) bland de förvalda, t.ex. ESCM, ESDF, ESIB"
        default: "ESCM"
        required: false
      delar:
        description: "Delar: ABCDE = standard, F = mät T + fukt i tid-höjd (~4 min), G = vilka medlemmar (lagged), V = stort prov av datakällor, Y = djupare prov (bilder i grenen matprov), Z = SMHI KNEP/MEPS-mappar, K = radar/satellit"
        default: "ABCDE"
        required: false

permissions:
  contents: write   # 21/11: delar=Y lagger bilder i grenen "matprov" (inget annat skrivs)

concurrency:
  group: testa-thredds
  cancel-in-progress: false

jobs:
  testa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Testa mot thredds
        env:
          MT_PUNKT: ${{ inputs.punkt }}
          MT_DELAR: ${{ inputs.delar }}
        run: python3 verktyg/testa_thredds.py

      # 21/11: stort matprov av datakallor (delar innehaller V) - se verktyg/testa_kallor.py
      - name: Testa datakällor
        if: contains(inputs.delar, 'V')
        run: python3 verktyg/testa_kallor.py

      - name: Testa polska TAF
        if: contains(inputs.delar, 'W')
        run: python3 verktyg/testa_taf_pl.py

      - name: Djupare prov av datakällor
        if: contains(inputs.delar, 'Y')
        run: python3 verktyg/testa_kallor2.py

      - name: Spara bilder i grenen matprov
        if: contains(inputs.delar, 'Y')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan matprov-tmp
          git rm -rq --cached .
          git add -f matprov kallor2.md
          git commit -qm "Mätprov $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:matprov

      - name: Testa IMGW:s flyg-API
        if: contains(inputs.delar, 'X')
        run: python3 verktyg/testa_taf_pl2.py

      # 21/11: prov Z - SMHI:s mappar for KNEP och CMEPS (verktyg/testa_smhi.py)
      - name: Leta SMHI KNEP och MEPS
        if: contains(inputs.delar, 'Z')
        run: python3 verktyg/testa_smhi.py

      # 21/11 kvall: prov K - radar (SMHI/met.no) och satellit (verktyg/testa_radar.py)
      - name: Prov radar och satellit
        if: contains(inputs.delar, 'K')
        run: |
          python3 -m pip install -q h5py pillow || python3 -m pip install -q --break-system-packages h5py pillow
          python3 verktyg/testa_radar.py

      - name: Prov SMHI-radarns format
        if: contains(inputs.delar, 'L')
        run: python3 verktyg/testa_smhi_radar.py

      # 21/11 kvall: prov J - sidan i en riktig webblasare (playwright), skarmbilder i grenen matprov
      - name: Prov sidan i webbläsare
        if: contains(inputs.delar, 'J')
        run: |
          python3 -m pip install -q playwright || python3 -m pip install -q --break-system-packages playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 verktyg/testa_sida.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan matprov-sida
          git rm -rq --cached .
          git add -f matprov sida.md
          git commit -qm "Prov J $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:matprov-sida

      - name: Prov satellittider och radarpaletter
        if: contains(inputs.delar, 'M')
        run: |
          python3 -m pip install -q pillow || python3 -m pip install -q --break-system-packages pillow
          python3 verktyg/testa_obs2.py

      - name: Prov andra modeller (AIFS, MET Nordic, nowcast)
        if: contains(inputs.delar, 'N')
        run: python3 verktyg/testa_extra.py

      - name: Spara resultatet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultat
          path: |
            testresultat.md
            das_ensemble.txt
            kallor.md
            taf_pl.md
            smhi.md
            radar.md
          if-no-files-found: ignore
