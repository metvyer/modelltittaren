# Modelltittaren - testkorning mot riktiga data (NYTT 19/11)
#
# Startas bara FOR HAND: Actions -> "Testa thredds" -> Run workflow (valj
# flygplats). Kor verktyg/testa_thredds.py: senaste ensemblekorning, medlems-
# attributen (.das), meteogramfragan, ett sannolikhetsomrade (binart) och
# mellanservern jamfort med direkt. Resultatet visas i korningens Summary och
# som fil under Artifacts. Andrar ingenting i repot och publicerar inget.
name: Testa thredds

on:
  workflow_dispatch:
    inputs:
      punkt:
        description: "Flygplats (ICAO) bland de förvalda, t.ex. ESCM, ESDF, ESIB"
        default: "ESCM"
        required: false
      delar:
        description: "Delar: ABCDE = standard, F = mät T + fukt i tid-höjd (~4 min), G = vilka medlemmar (lagged), V = stort prov av datakällor, Y = djupare prov (bilder i grenen matprov), Z = SMHI KNEP/MEPS-mappar, K = radar/satellit"
        default: "ABCDE"
        required: false

permissions:
  contents: write   # 21/11: delar=Y lagger bilder i grenen "matprov" (inget annat skrivs)

concurrency:
  group: testa-thredds
  cancel-in-progress: false

jobs:
  testa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Testa mot thredds
        env:
          MT_PUNKT: ${{ inputs.punkt }}
          MT_DELAR: ${{ inputs.delar }}
        run: python3 verktyg/testa_thredds.py

      # 21/11: stort matprov av datakallor (delar innehaller V) - se verktyg/testa_kallor.py
      - name: Testa datakällor
        if: contains(inputs.delar, 'V')
        run: python3 verktyg/testa_kallor.py

      - name: Testa polska TAF
        if: contains(inputs.delar, 'W')
        run: python3 verktyg/testa_taf_pl.py

      - name: Djupare prov av datakällor
        if: contains(inputs.delar, 'Y')
        run: python3 verktyg/testa_kallor2.py

      - name: Spara bilder i grenen matprov
        if: contains(inputs.delar, 'Y')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan matprov-tmp
          git rm -rq --cached .
          git add -f matprov kallor2.md
          git commit -qm "Mätprov $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:matprov

      - name: Testa IMGW:s flyg-API
        if: contains(inputs.delar, 'X')
        run: python3 verktyg/testa_taf_pl2.py

      # 21/11: prov Z - SMHI:s mappar for KNEP och CMEPS (verktyg/testa_smhi.py)
      - name: Leta SMHI KNEP och MEPS
        if: contains(inputs.delar, 'Z')
        run: python3 verktyg/testa_smhi.py

      # 21/11 kvall: prov K - radar (SMHI/met.no) och satellit (verktyg/testa_radar.py)
      - name: Prov radar och satellit
        if: contains(inputs.delar, 'K')
        run: |
          python3 -m pip install -q h5py pillow || python3 -m pip install -q --break-system-packages h5py pillow
          python3 verktyg/testa_radar.py

      - name: Prov SMHI-radarns format
        if: contains(inputs.delar, 'L')
        run: python3 verktyg/testa_smhi_radar.py

      # 21/11 kvall: prov J - sidan i en riktig webblasare (playwright), skarmbilder i grenen matprov
      - name: Prov sidan i webbläsare
        if: contains(inputs.delar, 'J') || contains(inputs.delar, 'S3') || contains(inputs.delar, 'S4') || contains(inputs.delar, 'S5') || contains(inputs.delar, 'S6') || contains(inputs.delar, 'S7') || contains(inputs.delar, 'S8') || contains(inputs.delar, 'S9')
        run: |
          python3 -m pip install -q playwright || python3 -m pip install -q --break-system-packages playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          if echo "${{ inputs.delar }}" | grep -q 'S9'; then python3 verktyg/testa_s9.py; elif echo "${{ inputs.delar }}" | grep -q 'S8'; then python3 verktyg/testa_detalj.py; elif echo "${{ inputs.delar }}" | grep -q 'S7'; then python3 verktyg/testa_mat.py; elif echo "${{ inputs.delar }}" | grep -q 'S6'; then python3 verktyg/testa_fav.py; elif echo "${{ inputs.delar }}" | grep -q 'S5'; then python3 verktyg/testa_omr.py; elif echo "${{ inputs.delar }}" | grep -q 'S4'; then python3 verktyg/testa_varn.py; elif echo "${{ inputs.delar }}" | grep -q 'S3'; then python3 verktyg/testa_exp.py; else python3 verktyg/testa_sida.py; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan matprov-sida
          git rm -rq --cached .
          git add -f matprov sida.md
          git commit -qm "Prov J $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:matprov-sida

      - name: Prov satellittider och radarpaletter
        if: contains(inputs.delar, 'M')
        run: |
          python3 -m pip install -q pillow || python3 -m pip install -q --break-system-packages pillow
          python3 verktyg/testa_obs2.py

      - name: Prov andra modeller (AIFS, MET Nordic, nowcast)
        if: contains(inputs.delar, 'N')
        run: python3 verktyg/testa_extra.py

      # 21/11 kvall: prov O - osynligt lage i mellanservern (en dold och en vanlig punktfraga)
      - name: Prov osynlig hämtning
        if: contains(inputs.delar, 'O')
        run: |
          M=https://modelltittaren.metvyer.workers.dev/mepslatest/meps_det_2_5km_20261121T15Z.ncml.ascii
          curl -s -o /dev/null -w "dold %{http_code} %{size_download}\n" -H "Origin: https://metvyer.github.io" "$M?air_temperature_2m%5B0:1%5D%5B0%5D%5B333%5D%5B444%5D&mtdold=1"
          curl -s -o /dev/null -w "vanlig %{http_code} %{size_download}\n" -H "Origin: https://metvyer.github.io" "$M?air_temperature_2m%5B0:1%5D%5B0%5D%5B334%5D%5B445%5D"

      - name: Prov statistiknyckel
        if: contains(inputs.delar, 'P')
        run: |
          S=https://modelltittaren.metvyer.workers.dev/statistik
          curl -s -H "Origin: https://metvyer.github.io" -H "X-Mt-Nyckel: fel-test" $S | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: (v if not isinstance(v, list) else len(v)) for k, v in d.items()})"
          curl -s -H "Origin: https://metvyer.github.io" $S | python3 -c "import json,sys; d=json.load(sys.stdin); print({k: (v if not isinstance(v, list) else len(v)) for k, v in d.items()})"
          curl -s -i -X OPTIONS -H "Origin: https://metvyer.github.io" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-mt-nyckel" $S | head -12
          R=https://modelltittaren.metvyer.workers.dev/radar/smhi
          echo "samla: $(curl -s -H 'Origin: https://metvyer.github.io' $R/samla)"
          L=$(curl -s -H 'Origin: https://metvyer.github.io' $R/lista); echo "lista: $L"
          T=$(echo "$L" | python3 -c "import json,sys; l=json.load(sys.stdin); print(l[-1] if l else '')")
          [ -n "$T" ] && curl -s -o /dev/null -w "bild %{http_code} %{size_download} %{content_type}\n" -H 'Origin: https://metvyer.github.io' $R/$T.png || true

      - name: Prov ra modellprofil Uppsala
        if: contains(inputs.delar, 'Q2')
        run: python3 verktyg/testa_profil.py

      - name: Prov skew-T-data Uppsala
        if: contains(inputs.delar, 'S2')
        run: |
          python3 -m pip install -q playwright || python3 -m pip install -q --break-system-packages playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 verktyg/testa_skew.py

      - name: Prov alla variabelnamn
        if: contains(inputs.delar, 'D2')
        run: python3 verktyg/testa_dds.py

      # 23/11: Forsvarsmaktens oppna riksintressen-geodata -> GeoJSON (artefakt fm_omraden)
      - name: FM-omraden
        if: contains(inputs.delar, '99')
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y gdal-bin > /dev/null
          bash verktyg/fm_omraden.sh
      - name: FM-omraden till grenen fm-data
        if: contains(inputs.delar, '99')
        run: |
          cp fm/ut/omraden_fm.json /tmp/ && cd /tmp && rm -rf fmgren && mkdir fmgren && cd fmgren && git init -q && git checkout -q -b fm-data
          cp /tmp/omraden_fm.json . && git add -A && git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "FM-omraden"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fm-data
      - name: FM-omraden artefakt
        if: contains(inputs.delar, '99')
        uses: actions/upload-artifact@v4
        with:
          name: fm_omraden
          path: fm/ut/

      # 23/11: raknas graupel in i snofallet? (Ishalka = nederbord - snofall)
      - name: Prov graupel i snofallet
        if: contains(inputs.delar, 'GR')
        run: python3 verktyg/testa_graupel.py

      # 22/11: fallstudie (verktyg/fall.py) - text + bilder i grenen matprov-fall
      - name: Fallstudie
        if: contains(inputs.delar, 'FALL')
        run: |
          python3 verktyg/fall.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan matprov-fall
          git rm -rq --cached .
          git add -f fall fall.md
          git commit -qm "Fall $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:matprov-fall

      - name: Spara resultatet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresultat
          path: |
            testresultat.md
            das_ensemble.txt
            kallor.md
            taf_pl.md
            smhi.md
            radar.md
          if-no-files-found: ignore
