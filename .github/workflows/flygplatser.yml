# Modelltittaren - uppdatera Europas flygplatser och banor (NYTT 21/11)
# Kors var 6:e manad (1 januari och 1 juli) och kan startas for hand. Hamtar OurAirports (public domain),
# kor verktyg/flygplatser_europa.py och lagger in flygplatser_europa.json + banor_europa.json om de andrats.
name: Uppdatera flygplatser

on:
  schedule:
    - cron: "17 3 1 1,7 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Hämta OurAirports
        run: |
          curl -sfL -o /tmp/airports.csv https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv
          curl -sfL -o /tmp/runways.csv https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/runways.csv
      - name: Bygg listorna
        run: python3 verktyg/flygplatser_europa.py /tmp/airports.csv /tmp/runways.csv
      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flygplatser_europa.json banor_europa.json
          if git diff --cached --quiet; then echo "Inga ändringar."; else git commit -m "Flygplatser Europa: halvårsuppdatering från OurAirports" && git push; fi
