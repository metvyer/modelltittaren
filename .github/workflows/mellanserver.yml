# Laddar upp mellanservern till Cloudflare när koden ändras (eller för hand).
# Nyckeln ligger som hemligheter i GitHub (Settings -> Secrets -> Actions), aldrig i koden.
name: Mellanserver

on:
  push:
    branches: [main]
    paths: ["verktyg/mellanserver.js", "verktyg/wrangler.toml", ".github/workflows/mellanserver.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ladda-upp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ladda upp med Wrangler
        working-directory: verktyg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Kontroll
        run: |
          sleep 5
          curl -s https://modelltittaren.metvyer.workers.dev/ ; echo
