# Modelltittaren - forhamtning och publicering
#
# Var 10:e minut (GitHub kor det i praktiken ca en gang i timmen): finns en ny
# komplett MEPS-korning hamtas tid-hojd for de forvalda flygplatserna
# (verktyg/forhamta.py). Datat sparas pa grenen "data" (skrivs over varje gang -
# ingen historik som vaxer). Nar korningen ar klar startar "Publicera"
# (publicera.yml), som lagger ut sidan med datat.
# NYTT 19/11 em: tva varv. Varv 1 = moln/vind som forut -> sparas och publiceras
# direkt (Publicera startas har). Varv 2 = temperatur + fukt pa modellnivaer
# (ca 20 min) -> sparas igen; Publicera startar da av sig sjalv nar jobbet ar klart.
name: Förhämtning

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # for att starta Publicera efter varv 1

concurrency:
  group: forhamtning
  cancel-in-progress: false

jobs:
  forhamta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Hämta tidigare förhämtat data (grenen data)
        run: |
          mkdir -p forhamtat
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=forhamtat checkout origin/data -- .
            git reset -q
          fi
          ls -R forhamtat | head -20

      # NYTT 20/11: varv 0 = Sverigeoversikten (ensemblens byvind/sikt/molnbas, 5 km, +0..+36) - FORE tid-hojd
      - name: Numpy (for Sverigeöversikten)
        run: python3 -m pip install --quiet --break-system-packages numpy || python3 -m pip install --quiet numpy

      - name: Sverigeöversikt (varv 0)
        id: ens
        run: python3 verktyg/forhamta.py forhamtat ens

      - name: Spara datat på grenen data (varv 0)
        if: steps.ens.outputs.andrat == 'ja'
        run: |
          cd forhamtat
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Sverigeöversikt $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      # NYTT 23/11: samma oversikt till Cloudflare R2 (sidan laser darifran via mellanservern, GitHub ar reserv)
      - name: Sverigeöversikten till R2
        if: steps.ens.outputs.andrat == 'ja'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_HEMLIG }}
        run: bash verktyg/till_r2.sh || echo "R2-uppladdningen misslyckades (sidan anvander GitHub)"

      - name: Publicera Sverigeöversikten direkt
        if: steps.ens.outputs.andrat == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicera.yml -R "${{ github.repository }}" --ref main || echo "Kunde inte starta Publicera"

      # NYTT 23/11 kvall: marktryck QFF (hela MEPS-omradet, 10 km, +0..+36) for isobarerna - bara till R2
      - name: Hämta QFF
        id: qff
        run: python3 verktyg/forhamta.py forhamtat qff || echo "QFF misslyckades"

      - name: QFF till R2
        if: steps.qff.outputs.qff == 'ja'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_HEMLIG }}
        run: bash verktyg/qff_till_r2.sh || echo "QFF till R2 misslyckades"

      - name: Städa QFF (ska inte med på grenen data)
        run: rm -rf forhamtat/qff

      # NYTT 23/11 kvall: modellens yttemp/temp/daggpunkt i 2,5 km for alla VViS-stationer (+2..+6) - bara till R2
      - name: Hämta modellvärden för VViS-stationerna
        id: vvmod
        run: python3 verktyg/forhamta.py forhamtat vvmod || echo "VViS-modell misslyckades"

      - name: VViS-modellvärden till R2
        if: steps.vvmod.outputs.vvmod == 'ja'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_HEMLIG }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: aws s3 cp forhamtat/vvmod/senaste.json s3://modelltittaren-data/vvmod/senaste.json --endpoint-url https://64ff6e697fe9bcc9d141dd2798b79eee.r2.cloudflarestorage.com --content-type application/json --only-show-errors || echo "till R2 misslyckades"

      - name: Städa VViS-modellvärden
        run: rm -rf forhamtat/vvmod

      # NYTT 24/11: SMHI:s brandriskprognos (dygn) som kartor - bara nar SMHI har en ny korning, bara till R2
      - name: Hämta brandrisk
        id: brand
        run: python3 verktyg/forhamta.py forhamtat brand || echo "Brandrisk misslyckades"

      - name: Brandrisk till R2
        if: steps.brand.outputs.brand == 'ja'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_HEMLIG }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          E=https://64ff6e697fe9bcc9d141dd2798b79eee.r2.cloudflarestorage.com; B=s3://modelltittaren-data
          M=$(python3 -c "import json;print(json.load(open('forhamtat/brand/index.json'))['mapp'])")
          aws s3 cp --recursive "forhamtat/brand/$M" "$B/brand/$M" --endpoint-url $E --only-show-errors
          aws s3 cp forhamtat/brand/index.json "$B/brand/index.json" --endpoint-url $E --content-type application/json --only-show-errors
          for k in $(aws s3 ls "$B/brand/" --endpoint-url $E | awk '/PRE/{print $2}' | tr -d / | grep -v "^$M$"); do aws s3 rm --recursive "$B/brand/$k" --endpoint-url $E --only-show-errors; done
          echo "R2: brandrisk $M uppladdad"

      - name: Städa brandrisk
        run: rm -rf forhamtat/brand

      - name: Förhämta ny körning (varv 1, moln och vind)
        id: hamta
        run: python3 verktyg/forhamta.py forhamtat

      - name: Spara datat på grenen data (varv 1)
        if: steps.hamta.outputs.andrat == 'ja'
        run: |
          cd forhamtat
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Förhämtat data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Publicera molnen direkt
        if: steps.hamta.outputs.andrat == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicera.yml -R "${{ github.repository }}" --ref main || echo "Kunde inte starta Publicera (publiceras efter varv 2)"

      - name: Temperatur och fukt (varv 2)
        id: tq
        run: python3 verktyg/forhamta.py forhamtat tq

      - name: Spara datat på grenen data (varv 2)
        if: steps.tq.outputs.andrat == 'ja'
        run: |
          cd forhamtat
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Förhämtat data + T/q $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git
