# Modelltittaren - forhamtning och publicering
#
# Var 10:e minut (GitHub kor det i praktiken ca en gang i timmen): finns en ny
# komplett MEPS-korning hamtas tid-hojd for de forvalda flygplatserna
# (verktyg/forhamta.py). Datat sparas pa grenen "data" (skrivs over varje gang -
# ingen historik som vaxer). Nar korningen ar klar startar "Publicera"
# (publicera.yml), som lagger ut sidan med datat.
# NYTT 19/11 em: tva varv. Varv 1 = moln/vind som forut -> sparas och publiceras
# direkt (Publicera startas har). Varv 2 = temperatur + fukt pa modellnivaer
# (ca 20 min) -> sparas igen; Publicera startar da av sig sjalv nar jobbet ar klart.
name: Förhämtning

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # for att starta Publicera efter varv 1

concurrency:
  group: forhamtning
  cancel-in-progress: false

jobs:
  forhamta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Hämta tidigare förhämtat data (grenen data)
        run: |
          mkdir -p forhamtat
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=forhamtat checkout origin/data -- .
            git reset -q
          fi
          ls -R forhamtat | head -20

      # NYTT 20/11: varv 0 = Sverigeoversikten (ensemblens byvind/sikt/molnbas, 5 km, +0..+36) - FORE tid-hojd
      - name: Numpy (for Sverigeöversikten)
        run: python3 -m pip install --quiet --break-system-packages numpy || python3 -m pip install --quiet numpy

      - name: Sverigeöversikt (varv 0)
        id: ens
        run: python3 verktyg/forhamta.py forhamtat ens

      - name: Spara datat på grenen data (varv 0)
        if: steps.ens.outputs.andrat == 'ja'
        run: |
          cd forhamtat
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Sverigeöversikt $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Publicera Sverigeöversikten direkt
        if: steps.ens.outputs.andrat == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicera.yml -R "${{ github.repository }}" --ref main || echo "Kunde inte starta Publicera"

      - name: Förhämta ny körning (varv 1, moln och vind)
        id: hamta
        run: python3 verktyg/forhamta.py forhamtat

      - name: Spara datat på grenen data (varv 1)
        if: steps.hamta.outputs.andrat == 'ja'
        run: |
          cd forhamtat
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Förhämtat data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git

      - name: Publicera molnen direkt
        if: steps.hamta.outputs.andrat == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publicera.yml -R "${{ github.repository }}" --ref main || echo "Kunde inte starta Publicera (publiceras efter varv 2)"

      - name: Temperatur och fukt (varv 2)
        id: tq
        run: python3 verktyg/forhamta.py forhamtat tq

      - name: Spara datat på grenen data (varv 2)
        if: steps.tq.outputs.andrat == 'ja'
        run: |
          cd forhamtat
          git init -q
          git checkout -q -b data
          git add -A
          git -c user.name="modelltittaren-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Förhämtat data + T/q $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
          rm -rf .git
